{% extends "base.html" %}

{% block content %}

<form method="POST">
    <div>
        <label for="username">Uživatelské jméno</label>
        <input type="text" name="username" id="username" value="{{ user[1] }}" required>
    </div>

    <div>
        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" value="{{ user[2] }}" required>
    </div>

    <div>
        <label for="role_id">Role</label>
        <select name="role_id" id="role_id">
            <option value="1" {% if user[3] == 1 %}selected{% endif %}>Admin</option>
            <option value="2" {% if user[3] == 2 %}selected{% endif %}>Visitor</option>
            <!-- Přidej další role podle potřeby -->
        </select>
    </div>

    <button type="submit">Upravit uživatele</button>
</form>
