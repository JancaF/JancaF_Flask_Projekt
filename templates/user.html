{% extends "base.html" %}

{% block title %}
    USER LIST
{% endblock %}

{% block content %}
<h2>Seznam uživatelů</h2>
<ul>
    {% for user in results %}
        <li>
            {{ user['username'] }}
            <a href="{{ url_for('login.edit_user', user_id=user['id']) }}">Upravit</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
